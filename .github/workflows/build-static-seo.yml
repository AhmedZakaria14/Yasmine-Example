name: Build SEO-safe static site

on:
  push:
    branches:
      - seo-indexing-fix
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yasmin-static-seo-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static export
        run: npm run build

      - name: Validate SEO output
        run: node scripts/validate-static-seo.mjs

      - name: Add Hostinger configuration
        shell: bash
        run: |
          cat > out/.htaccess <<'HTACCESS'
          DirectoryIndex index.html
          ErrorDocument 404 /404.html

          <IfModule mod_rewrite.c>
            RewriteEngine On

            RewriteCond %{HTTPS} !=on [OR]
            RewriteCond %{HTTP_HOST} ^www\.alyasmin-services\.com$ [NC]
            RewriteRule ^ https://alyasmin-services.com%{REQUEST_URI} [R=301,L,NE]

            RewriteCond %{THE_REQUEST} \s/+index\.html(?:[?\s]) [NC]
            RewriteRule ^index\.html$ / [R=301,L,NE]

            RewriteCond %{THE_REQUEST} \s/+(.+)/index\.html(?:[?\s]) [NC]
            RewriteRule ^(.+)/index\.html$ /$1/ [R=301,L,NE]

            RewriteCond %{THE_REQUEST} \s/+(.+)\.html(?:[?\s]) [NC]
            RewriteRule ^(.+)\.html$ /$1/ [R=301,L,NE]
          </IfModule>

          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set X-Frame-Options "SAMEORIGIN"
            <FilesMatch "\.txt$">
              Header set X-Robots-Tag "noindex, nofollow"
            </FilesMatch>
          </IfModule>

          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType image/webp "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType font/woff2 "access plus 1 year"
          </IfModule>
          HTACCESS

          touch out/.nojekyll

      - name: Publish generated files to seo-built
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yasmin-static-site
          mkdir -p /tmp/yasmin-static-site
          cp -a out/. /tmp/yasmin-static-site/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan seo-built
          git rm -rf .
          git clean -fdx
          cp -a /tmp/yasmin-static-site/. .
          git add -A
          git commit -m "build: publish SEO-fixed static site [skip ci]"
          git push --force origin HEAD:seo-built
