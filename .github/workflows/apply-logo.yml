name: Apply uploaded logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-logo.yml'
      - 'images/brand/al-yasmin-logo-new.b64'

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode transparent logo and publish favicon assets
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode images/brand/al-yasmin-logo-new.b64 > images/brand/al-yasmin-logo.png
          cp images/brand/al-yasmin-logo.png favicon.png
          cp images/brand/al-yasmin-logo.png apple-touch-icon.png

      - name: Commit generated binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/brand/al-yasmin-logo.png favicon.png apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "Logo assets already up to date."
            exit 0
          fi
          git commit -m "fix(brand): apply transparent logo and favicon"
          git push origin HEAD:main
